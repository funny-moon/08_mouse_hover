<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        height: 100vh;
        background-image: linear-gradient(to top, #a3bded 0%, #6991c7 100%);
      }
      .hover_wrap {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      figure {
        width: 400px;
        margin: 10px;
        overflow: hidden;
        position: relative;
        background-color: #000;
      }
      figure img {
        display: block;
        width: 100%;
        transition: opacity 0.3s;
      }
      figure:hover img {
        opacity: 0.3;
      }

      /*가싱요소로 선 만들기 */
      figure::before {
        content: "";
        width: 60px;
        height: 1px;
        background-color: #fff;
        position: absolute;
        transform: translate(-50%, -50%);
      }
      figure::after {
        content: "";
        width: 1px;
        height: 60px;
        background-color: #fff;
        position: absolute;
        transform: translate(-50%, -50%);
      }

      /* hover1 */
      figure.hover1::before {
        left: 120%;
        top: 50%;
        opacity: 0;
        transition: all 0.3s ease-in;
      }
      figure.hover1::after {
        left: 50%;
        top: 120%;
        opacity: 0;
        transition: all 0.3s ease-in;
      }

      figure.hover1:hover::before {
        left: 50%;
        top: 50%;
        opacity: 1;
      }
      figure.hover1:hover::after {
        left: 50%;
        top: 50%;
        opacity: 1;
      }

      /* hover2 */
      figure.hover2::before {
        left: -20%;
        top: 50%;
        opacity: 0;
        transition: all 0.3s ease-in;
      }
      figure.hover2::after {
        left: 50%;
        top: -20%;
        opacity: 0;
        transition: all 0.3s ease-in;
      }

      figure.hover2:hover::before {
        left: 50%;
        top: 50%;
        opacity: 1;
      }
      figure.hover2:hover::after {
        left: 50%;
        top: 50%;
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div class="hover_wrap">
      <figure class="hover1">
        <img src="img/neom-e75CfMG0Sgo-unsplash.jpg" alt="" />
      </figure>
      <figure class="hover2">
        <img src="img/neom-V8w0gSmxajY-unsplash.jpg" alt="" />
      </figure>
    </div>
  </body>
</html>
